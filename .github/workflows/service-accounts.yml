name: Service account contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        run: python -m pip install '.[service-accounts]' 'pytest>=7,<9'
      - name: Contracts without live SSO
        run: python -m pytest -q tests/test_introspection.py tests/test_service_account_extension.py
      - name: Build distributable
        run: python -m pip wheel --no-deps --wheel-dir dist .
